name: infra-markkyn
services:
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    environment:
     - GF_SERVER_ROOT_URL=http://my.markkyn.com/
     - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
     - GF_PLUGINS_PREINSTALL=grafana-clock-panel
    ports:
     - '3000:3000'
    volumes:
     - 'grafana_storage:/var/lib/grafana'
    networks:
      - network-zabbix
    links:
      - zabbix-mysql
      - zabbix-server
    depends_on:
      - zabbix-mysql
      - zabbix-server

  portainer:
    image: ngxson/portainer-ce-without-annoying:latest 
    container_name: portainer
    ports:
      - '18000:8000'
      - '19000:19000'
    volumes:
      - ./portainer/data:/data:Z
      - /var/run/docker.sock:/var/run/docker.sock

include:
  # Password management
  # - services/passbolt/docker-compose-ce.yaml # PassBolt
  # Gaming
  - services/gaming/docker-compose.yaml # Minecraft
  # Automation
  - services/automation/docker-compose.yaml # n8n
  # Network
  - services/network/docker-compose.yaml # Zabbix

volumes:
  grafana_storage: {}
