name: infra-markkyn
services:
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    environment:
     - GF_SERVER_ROOT_URL=http://my.markkyn.com/
     - GF_PLUGINS_PREINSTALL=grafana-clock-panel
    ports:
     - '3000:3000'
    volumes:
     - 'grafana_storage:/var/lib/grafana'

include:
  # Password management
  - docker/services/passbolt/docker-compose-ce.yaml # PassBolt
  # Gaming
  - docker/services/gaming/docker-compose.yaml # Minecraft
  # Automation
  - docker/services/automation/docker-compose.yaml # n8n

volumes:
  grafana_storage: {}